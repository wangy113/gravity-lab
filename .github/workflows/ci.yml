name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Poly Haven assets are fetched at build time, checked against assets/assets.lock.json
      # by md5, and cached between runs. Phase 2 commits optimized copies instead.
      - uses: actions/cache@v4
        with:
          path: public/assets
          key: polyhaven-${{ hashFiles('assets/manifest.json', 'assets/assets.lock.json') }}
      - run: npm run assets:sync
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Add the prototype to the site
        run: |
          mkdir -p dist/prototype
          cp prototype/index.html dist/prototype/index.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    # Publishes the default branch to GitHub Pages.
    # Needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
    if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
