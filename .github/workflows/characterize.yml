name: Characterize prototype

# Manual only: runs the prototype in headless Chromium (about 10 minutes, needs jsDelivr and
# Poly Haven) and uploads the measured baseline. Commit it if it should replace
# tests/scenarios/baseline.json.
on:
  workflow_dispatch:
    inputs:
      repeats:
        description: Runs per scenario
        default: '2'

permissions:
  contents: read

jobs:
  characterize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run characterize -- --repeats ${{ inputs.repeats }}
      - uses: actions/upload-artifact@v4
        with:
          name: baseline
          path: tests/scenarios/baseline.json
